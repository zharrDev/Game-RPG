<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arga — Open World RPG Pixel Art</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="270" tabindex="0"></canvas>
    <div id="loading">Memuat sprite Arga…</div>
    <div id="toast" class="hidden"></div>

    <div id="overlay" class="hidden">
      <!-- MENU UTAMA -->
      <section id="menu-panel" class="panel hidden">
        <h1>Arga — Perjalanan Sang Warrior</h1>
        <p class="muted">Pilih profil untuk melanjutkan perjalanan, atau buat profil baru. Semua progres disimpan di server C#.</p>
        <div id="profile-list" class="profile-list"></div>
        <form id="new-profile-form" autocomplete="off">
          <input id="new-profile-name" type="text" maxlength="24" placeholder="Nama profil baru" required />
          <button type="submit">Mulai perjalanan baru</button>
        </form>
        <p id="menu-status" class="muted small"></p>
      </section>

      <!-- PAUSE -->
      <section id="pause-panel" class="panel hidden">
        <h2>Perjalanan dijeda</h2>
        <p id="pause-status" class="muted small"></p>
        <h3>Simpan / muat perjalanan</h3>
        <div id="save-slots" class="slots"></div>
        <div id="load-slots" class="slots"></div>
        <div class="buttons">
          <button id="pause-resume">Lanjut bermain</button>
          <button id="pause-quicksave">Simpan sekarang (slot aktif)</button>
          <button id="pause-save">Simpan ke slot aktif</button>
          <button id="pause-journey" class="secondary">Catatan perjalanan</button>
          <button id="pause-menu" class="danger">Simpan &amp; kembali ke menu</button>
        </div>
      </section>

      <!-- JOURNEY -->
      <section id="journey-panel" class="panel hidden">
        <h2>Sejauh mana perjalananmu</h2>
        <div id="journey-body"></div>
        <div class="buttons">
          <button id="journey-back">Kembali</button>
        </div>
      </section>

      <!-- VICTORY -->
      <section id="victory-panel" class="panel hidden">
        <h2>Ruin Warden tumbang!</h2>
        <div id="victory-body"></div>
        <div class="buttons">
          <button id="victory-back">Lanjut menjelajah</button>
        </div>
      </section>
    </div>
  </div>
  <script type="module" src="/js/game.js"></script>
</body>
</html>
