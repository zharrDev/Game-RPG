; Preset ekspor Linux. Penting: game membaca PNG/JSON/font sebagai byte mentah
; (Assets.LoadTexture via FileAccess), jadi file aslinya harus ikut diekspor —
; bukan hanya versi hasil impor Godot. Itu tugas include_filter di bawah.
; Ekspor: Editor > Project > Export > Linux (atau
;   godot --headless --path game --export-release "Linux" build/linux/arga.x86_64)

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/**/*.png,assets/**/*.json,assets/**/*.fnt,assets/**/*.txt,assets/**/*.gdshader"
exclude_filter="assets/character/frames/*"
export_path="build/linux/arga.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
